<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bigram Model</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      padding: 16px;
    }

    #chat {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      margin: 0; 
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }
      #chat {
        margin: 0 auto;
        height: 100dvh;
        padding: 16px;
      }
      .input-row {
        margin-top: auto; 
      }
    }

    /* Style for YOUR sent text - clean, simple, no boxes or blue shades */
    .user-message {
      font-size: 15px;
      color: #333;
      padding: 4px 12px;
      font-weight: bold;
    }

    /* Style for the MODEL's response - includes the card and the blue accent line */
    .response {
      background: #fff;
      border-left: 3px solid #4a90e2;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .input-row input {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      background: #fff;
    }

    .input-row input:focus {
      border-color: #4a90e2;
    }

    .input-row button {
      font-size: 15px;
      white-space: nowrap;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="chat"></div>

  <script>
    const chat = document.getElementById('chat');

    function addInput() {
      const row = document.createElement('div');
      row.className = 'input-row';

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Enter a word...';
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('autocorrect', 'off');
      input.setAttribute('autocapitalize', 'off');

      const btn = document.createElement('button');
      btn.textContent = 'Send';

      async function submit() {
        const word = input.value.trim();
        if (!word) return;
        
        btn.disabled = true;
        input.disabled = true;

        // 1. Add YOUR text cleanly to the history first
        const userLog = document.createElement('div');
        userLog.className = 'user-message';
        userLog.textContent = word;
        chat.appendChild(userLog);

        try {
          const res = await fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: word
          });
          const text = await res.text();

          // Remove the active input field row
          row.remove();

          // 2. Add the model's response with the white box and blue border layout
          const resp = document.createElement('div');
          resp.className = 'response';
          resp.textContent = text;
          chat.appendChild(resp);
        } catch (e) {
          row.remove();
          const resp = document.createElement('div');
          resp.className = 'response';
          resp.textContent = 'Error: ' + e.message;
          chat.appendChild(resp);
        }

        // Spawn a brand new active input area at the bottom
        addInput();
      }

      btn.addEventListener('click', submit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

      row.appendChild(input);
      row.appendChild(btn);
      chat.appendChild(row);
      input.focus();
    }

    addInput();
  </script>
</body>
</html>
